<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice-Enabled Kiosk Assistant</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; max-width: 768px; margin: 40px auto; padding: 20px; background-color: #f8f9fa; color: #343a40; }
        h1 { text-align: center; color: #007bff; }
        .input-section { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
        #prompt-input { flex-grow: 1; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; font-size: 16px; }
        button { padding: 12px 20px; border: none; background-color: #007bff; color: white; border-radius: 8px; cursor: pointer; font-size: 16px; transition: background-color 0.2s; }
        button:hover { background-color: #0056b3; }
        #voice-btn { background-color: #28a745; }
        #voice-btn:hover { background-color: #218838; }
        #voice-btn.recording { background-color: #dc3545; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        #response-container { background-color: #ffffff; border: 1px solid #dee2e6; padding: 20px; border-radius: 8px; min-height: 150px; white-space: pre-wrap; word-wrap: break-word; font-family: "Courier New", Courier, monospace; font-size: 14px; line-height: 1.6; }
        .loading { color: #6c757d; }
        .status { margin-top: 10px; font-size: 14px; color: #6c757d; }
    </style>
</head>
<body>
    <h1>Voice-Enabled Food Kiosk Assistant</h1>
    
    <form id="prompt-form">
        <div class="input-section">
            <input type="text" id="prompt-input" placeholder="Type your order or use voice input..." autocomplete="off">
            <button type="button" id="voice-btn">🎤 Voice</button>
            <button type="submit">Send</button>
        </div>
    </form>
    
    <div id="status" class="status"></div>
    
    <h2>Response</h2>
    <pre id="response-container" class="loading">The server's response will appear here...</pre>

    <script src="{{ url_for('static', filename='voice-script.js') }}"></script>
</body>
</html>
